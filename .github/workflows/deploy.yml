name: Build a nasadenie na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stiahnutie kódu
        uses: actions/checkout@v4

      - name: Nastavenie Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inštalácia závislostí
        run: npm ci

      - name: Zápis čísla verzie (na kontrolu aktualizácie v appke)
        run: echo "{\"v\":\"${{ github.sha }}\"}" > public/version.json

      - name: Kontrola kódu (zjavné chyby, napr. preklep v názve)
        run: npm run lint

      - name: Build appky
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Skúška spustenia (platforma ukáže prihlásenie, inak sa nenasadí)
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom http://localhost:4173/ > dom.html
          grep -q "Prihlásiť sa" dom.html || { echo "::error::Platforma sa po zostavení nespustila — nenasadzuje sa."; exit 1; }

      - name: Príprava na GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasadenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
