<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>mateco — Interná platforma</title>
    <!-- Odkaz zákazníckeho portálu (?portal=…) má hneď pri otvorení názov portálu, nie internej platformy (1.0.877). -->
    <script>if (/[?&]portal=/.test(location.search)) { var l = ""; try { l = localStorage.getItem("mateco-portal-lang") || ""; } catch (e) {} var L = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]; var sk = l ? l === "sk" : L.some(function (x) { return /^(sk|cs)\b/i.test(x || ""); }); document.title = sk ? "mateco — zákaznícky portál" : "mateco — customer portal"; }</script>

    <!-- PWA — umožňuje "Pridať na plochu" a otvorenie na celú obrazovku bez adresného riadku -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#E30613" />
    <meta name="robots" content="noindex, nofollow" />
    <link id="mateco-font" rel="stylesheet" href="./fonts/barlow.css" />

    <!-- Ikonky -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- iOS (Safari) — vlastné nastavenia, keďže Apple manifest.json len čiastočne rešpektuje -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mateco" />

    <!-- Android/Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <!-- Text hneď pri otvorení (slabý signál: zákaznícky portál sťahuje celú platformu) — React ho prepíše. -->
    <div id="root"><p role="status" style="text-align:center;padding:56px 16px;margin:0;color:#5A5A5A;font:15px Arial,sans-serif">Načítavam… / Loading…</p></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
