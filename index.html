<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>mateco — Interná platforma</title>

    <!-- PWA — umožňuje "Pridať na plochu" a otvorenie na celú obrazovku bez adresného riadku -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#E30613" />

    <!-- Ikonky -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- iOS (Safari) — vlastné nastavenia, keďže Apple manifest.json len čiastočne rešpektuje -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mateco" />

    <!-- Android/Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
