<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>mateco — Interná platforma</title>

    <!-- PWA — umožňuje "Pridať na plochu" a otvorenie na celú obrazovku bez adresného riadku -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#E30613" />

    <!-- Ikonky -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- iOS (Safari) — vlastné nastavenia, keďže Apple manifest.json len čiastočne rešpektuje -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="mateco" />

    <!-- Android/Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <!-- html2canvas — potrebuje ho servisný protokol na "odfotenie" (vnorený iframe cez
         srcDoc ho preberá odtiaľto ako window.parent.html2canvas, viď decodeProtocolHtml/
         sendSnapshotToApp v App.jsx — spoľahlivejšie než ťahať vlastnú kópiu znova cez
         <base> v srcDoc dokumente, čo niektoré mobilné prehliadače nerešpektujú). Načíta sa
         s appkou vždy (nie len keď sa otvorí protokol), takže ho service worker zacachuje
         pre offline použitie hneď pri prvom bežnom otvorení appky. -->
    <script src="./html2canvas.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
